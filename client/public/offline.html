<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff5a1f" />
    <title>You’re offline · Kapu</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #faf8f5; color: #14171f; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      .box { max-width: 380px; }
      img { width: 72px; height: 72px; border-radius: 20px; }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { color: #5b6170; line-height: 1.5; margin: 0 0 20px; }
      a.btn { display: inline-block; border-radius: 999px; padding: 14px 26px; background: #ff5a1f; color: #fff; font-size: 16px; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="/icon-192.png" alt="Kapu" />
      <h1>You’re offline</h1>
      <p>Check your data or Wi-Fi, then try again. Your cart and saved items are safe on this phone.</p>
      <a class="btn" href="/">Try again</a>
    </div>
  </body>
</html>
